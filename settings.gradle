gradle.ext.modules = []
def abi = gradle.startParameter.projectProperties.get('ABI')
gradle.ext.abiFilters = (abi != null) ? abi.split(",") : ['arm64-v8a', 'armeabi-v7a', 'x86_64']

gradle.ext.localProps = new Properties()
gradle.ext.enableGoogleServices = false

def localPropsFile = file('local.properties')

if (localPropsFile.isFile()) {
    gradle.ext.localProps.load(localPropsFile.newDataInputStream())
}

// Release bundles are deliberately unsigned. Sign the universal APK outside the
// build tree with a private, persistent key. Debug builds use the Android
// Gradle plugin's normal per-workstation debug key.

rootProject.name = 'Home Car'

include ':fermata'

include ':utils'
project(':utils').projectDir = file('depends/utils')

include ':web'
project(':web').projectDir = file('modules/web')

gradle.ext.modules.add(':web')
