name: Build HomeCar

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Optional prior build run to repeat emulator checks without rebuilding unchanged app sources'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: homecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify hosted Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -d "$ANDROID_HOME/ndk/29.0.14206865"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :fermata:testAutoDebugUnitTest :web:testAutoDebugUnitTest --no-daemon

      - name: Build unsigned Android Auto release bundle
        run: ./gradlew :fermata:bundleAutoRelease --no-daemon

      - name: Generate universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          AAB="$(find fermata/build/outputs/bundle -type f -name '*.aab' -path '*autoRelease*' -print -quit)"
          test -n "$AAB"
          cp "$AAB" dist/HomeCar-release.aab

          curl -fL --retry 5 \
            -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar

          echo '378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  /tmp/bundletool.jar' | sha256sum --check
          java -jar /tmp/bundletool.jar validate --bundle="$AAB"
          java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=web > /tmp/web-manifest.xml
          python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("/tmp/web-manifest.xml"); ns = "{http://schemas.android.com/apk/distribution}"; fusing = root.find(".//" + ns + "fusing"); assert fusing is not None and fusing.get(ns + "include") == "true", "The web feature must be fused into the universal APK"'

          # A fresh test key signs this transport/smoke-test artifact only.
          # Neither temporary key material nor the owner's private release key is uploaded.
          umask 077
          CI_KEY_DIR="$(mktemp -d)"
          openssl rand -base64 32 > "$CI_KEY_DIR/password"
          keytool -genkeypair -alias homecar-ci -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=HomeCar CI Test" -storetype PKCS12 \
            -keystore "$CI_KEY_DIR/test.p12" \
            -storepass:file "$CI_KEY_DIR/password" -keypass:file "$CI_KEY_DIR/password"
          java -jar /tmp/bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=/tmp/homecar.apks \
            --mode=universal \
            --ks="$CI_KEY_DIR/test.p12" --ks-key-alias=homecar-ci \
            --ks-pass="file:$CI_KEY_DIR/password" --key-pass="file:$CI_KEY_DIR/password"

          unzip -p /tmp/homecar.apks universal.apk > dist/HomeCar-intermediate.apk
          test -s dist/HomeCar-intermediate.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/HomeCar-intermediate.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/HomeCar-intermediate.apk > dist/apk-metadata.txt
          sha256sum dist/HomeCar-release.aab dist/HomeCar-intermediate.apk > dist/build-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HomeCar-release-build
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeCar-check-reports
          path: |
            fermata/build/reports/
            fermata/build/test-results/
            modules/web/build/reports/
            modules/web/build/test-results/
          if-no-files-found: ignore

  lint:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify hosted Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -d "$ANDROID_HOME/ndk/29.0.14206865"

      - name: Android Lint
        timeout-minutes: 15
        # The base app's lint task also analyzes and reports dynamic-feature issues.
        run: |
          chmod +x ./gradlew
          bash scripts/run-android-lint.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeCar-lint-reports
          path: |
            fermata/build/reports/lint-results-*
            modules/web/build/reports/lint-results-*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeCar-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: ignore

  emulator-smoke:
    needs: android
    if: ${{ always() && (needs.android.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_run != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select and validate build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUILD_RUN: ${{ inputs.build_run }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          requested = os.environ.get('REQUESTED_BUILD_RUN', '')
          run_id = requested or os.environ['CURRENT_RUN']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('build_run must contain only digits')
          repository = os.environ['REPOSITORY']
          source_sha = os.environ['CURRENT_SHA']
          if requested:
              def api(path):
                  return json.loads(subprocess.check_output(['gh', 'api', path]))
              run = api(f'repos/{repository}/actions/runs/{run_id}')
              if run['repository']['full_name'] != repository or run['head_repository']['full_name'] != repository:
                  raise SystemExit('The selected build must belong to this repository')
              if run['status'] != 'completed' or run['event'] not in ('push', 'workflow_dispatch'):
                  raise SystemExit('Select a completed repository build run')
              jobs = api(f'repos/{repository}/actions/runs/{run_id}/jobs?per_page=100')
              if jobs['total_count'] != len(jobs['jobs']):
                  raise SystemExit('Unexpected number of jobs in selected run')
              for name in ('android', 'lint'):
                  matches = [job for job in jobs['jobs'] if job['name'] == name]
                  if len(matches) != 1 or matches[0]['conclusion'] != 'success':
                      raise SystemExit(f'The selected run must have successful {name} checks')
              source_sha = run['head_sha']
              if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
                  raise SystemExit('Invalid source commit')
              changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', source_sha, os.environ['CURRENT_SHA']]).decode().split('\0')
              allowed = lambda name: name.startswith(('.github/', 'scripts/', 'docs/')) or name in ('README', 'README.md', 'CHANGELOG', 'CHANGELOG.md')
              app_changes = [name for name in changed if name and not allowed(name)]
              if app_changes:
                  raise SystemExit('App sources changed since the selected build: ' + ', '.join(app_changes))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_id={run_id}\nsource_sha={source_sha}\n')
          pathlib.Path('smoke-artifacts').mkdir(exist_ok=True)
          pathlib.Path('smoke-artifacts/build-provenance.json').write_text(json.dumps({'build_run': run_id, 'source_commit': source_sha, 'smoke_commit': os.environ['CURRENT_SHA'], 'reused_build': bool(requested)}, indent=2))
          PY

      - uses: actions/download-artifact@v4
        with:
          name: HomeCar-release-build
          path: dist/
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify build artifact checksums
        run: sha256sum --check dist/build-sha256.txt

      - name: Prepare disposable Android emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-artifacts
          export ANDROID_AVD_HOME="$RUNNER_TEMP/homecar-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          # Use the hosted runner's accepted SDK licenses; never answer a new license prompt.
          SDK_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$SDK_TOOLS/sdkmanager"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          timeout 300 "$SDK_TOOLS/sdkmanager" "emulator" "system-images;android-36;google_apis;x86_64" < /dev/null
          printf 'no\n' | "$SDK_TOOLS/avdmanager" create avd --name HomeCarSmoke --path "$ANDROID_AVD_HOME/HomeCarSmoke.avd" --package "system-images;android-36;google_apis;x86_64" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee smoke-artifacts/available-avds.txt
          grep -Fxq HomeCarSmoke smoke-artifacts/available-avds.txt
          test -e /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd HomeCarSmoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -camera-back none -camera-front none > smoke-artifacts/emulator.log 2>&1 &
          EMULATOR_PID=$!
          sleep 3
          if ! kill -0 "$EMULATOR_PID"; then
            cat smoke-artifacts/emulator.log
            exit 1
          fi

      - name: Verify release settings in light, dark, and large-font modes
        run: python3 scripts/emulator-smoke.py dist/HomeCar-intermediate.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeCar-emulator-smoke
          path: smoke-artifacts/
          if-no-files-found: ignore

      - name: Stop emulator
        if: always()
        run: adb -e emu kill || true
